name: Complete external provider quality checks

on:
  push:
    branches:
      - validate-crypto-provider-760-20261008

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_TERM_COLOR: never
      RUST_TEST_THREADS: "1"
      RAYON_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c4df97251dfefcb44ed0a198c92b149f65d1d035
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source and tools
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = c4df97251dfefcb44ed0a198c92b149f65d1d035
          test -z "$(git status --porcelain)"
          git diff 279572ea60f3a7a6e5237e066a6f4a35eee611e0 HEAD --check
          git diff --name-only 279572ea60f3a7a6e5237e066a6f4a35eee611e0 HEAD
          printf '%s\n' \
            '9a742d66e29879b04acbc362a2f4d92799bd8119c309c3d547056fb98860a648  .github/workflows/ci.yml' \
            '764a9125a0c10cc6440d70895dd2921062e5e0472e4dde71d933b0a8a0374188  tests/crypto-provider/Cargo.toml' \
            '6f478af5f692bf6f43c1e8ff3d6bed382a667e36d2890461aaa64638ea060399  tests/crypto-provider/tests/aws.rs' | sha256sum --check
          git ls-files -z | xargs -0 sha256sum > "$RUNNER_TEMP/source.sha256"
          rustup toolchain install 1.97.0 --profile minimal --component clippy --component rustfmt
          rustc --version --verbose
          cargo --version
          uname -a
          df -h .
          curl --fail --location --retry 2 --output "$RUNNER_TEMP/typos.tar.gz" https://github.com/crate-ci/typos/releases/download/v1.51.1/typos-v1.51.1-x86_64-unknown-linux-musl.tar.gz
          echo '93c301fd4120ff076e2cc2a6d6a61cab4a4bdb81899287c0938b452e56d1f454  '"$RUNNER_TEMP/typos.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/typos"
          tar -xzf "$RUNNER_TEMP/typos.tar.gz" -C "$RUNNER_TEMP/typos" ./typos
          "$RUNNER_TEMP/typos/typos" --version
      - name: Resolve complete dependency graphs
        run: |
          set -euo pipefail
          cargo metadata --format-version 1 --all-features --features reqwest/native-tls,reqwest/rustls-no-provider,aws-lc-rs/aws-lc-sys > "$RUNNER_TEMP/root-metadata.json"
          cargo generate-lockfile --manifest-path tests/crypto-provider/Cargo.toml
          cargo metadata --locked --format-version 1 --all-features --manifest-path tests/crypto-provider/Cargo.toml > "$RUNNER_TEMP/fixture-metadata.json"
          cargo fetch --locked
          cargo fetch --locked --manifest-path tests/crypto-provider/Cargo.toml
          sha256sum Cargo.lock tests/crypto-provider/Cargo.lock > "$RUNNER_TEMP/locks.sha256"
          cat "$RUNNER_TEMP/locks.sha256"
          cat Cargo.lock
          cat tests/crypto-provider/Cargo.lock
      - name: Record exact resolved dependency identities
        run: |
          set -euo pipefail
          cargo metadata --locked --offline --format-version 1 --no-default-features --features fs,aws-base,azure-base,gcp-base,http-base,reqwest,reqwest/native-tls,ring > "$RUNNER_TEMP/root-ring-metadata.json"
          python3 - <<'PYMETA'
          import hashlib
          import json
          import os
          import pathlib
          import tomllib
          logs = pathlib.Path(os.environ['RUNNER_TEMP'])
          missing_by_label = {}
          for label, lock_path, metadata_path in (
              ('root-all', 'Cargo.lock', 'root-metadata.json'),
              ('root-ring', 'Cargo.lock', 'root-ring-metadata.json'),
              ('fixture', 'tests/crypto-provider/Cargo.lock', 'fixture-metadata.json'),
          ):
              lock_bytes = pathlib.Path(lock_path).read_bytes()
              locked = tomllib.loads(lock_bytes.decode())['package']
              metadata = json.loads((logs / metadata_path).read_text())
              identities = {(p['name'], p['version'], p.get('source')) for p in locked}
              missing = [p['id'] for p in metadata['packages'] if (p['name'], p['version'], p.get('source')) not in identities]
              print(label, 'lock SHA256', hashlib.sha256(lock_bytes).hexdigest(), 'missing lock identities', missing)
              for package in metadata['packages']:
                  print(label, 'resolved', package['id'])
              if missing:
                  missing_by_label[label] = missing
          if missing_by_label:
              raise RuntimeError(('resolved packages absent from Cargo.lock', missing_by_label))
          PYMETA
          sha256sum --check "$RUNNER_TEMP/locks.sha256"
      - name: Check formatting and spelling
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo fmt --manifest-path tests/crypto-provider/Cargo.toml -- --check
          "$RUNNER_TEMP/typos/typos" --force-exclude
      - name: Check final source and lock integrity
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          sha256sum --check "$RUNNER_TEMP/locks.sha256"
          sha256sum --check "$RUNNER_TEMP/source.sha256" > "$RUNNER_TEMP/source-check.log"
          git diff --exit-code
          test -z "$(git status --porcelain)"
          echo 'Source and lock integrity checks passed on the pinned source commit.'
