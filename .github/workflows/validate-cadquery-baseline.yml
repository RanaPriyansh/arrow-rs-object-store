name: Qualify unchanged CadQuery baseline

on:
  push:
    branches:
      - validate-cadquery-baseline-20261008

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMBA_NUM_THREADS: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: validation
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: CadQuery/cadquery
          ref: 5f5bc62b255f62e3512105740025361b6c31eddd
          path: source
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - name: Install native runtime libraries
        run: |
          set -euo pipefail
          test "$(git -C validation rev-parse HEAD)" = "$GITHUB_SHA"
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libgl1 libegl1 libxrender1 libxext6
          python --version
          uname -a
          df -h .
      - name: Install checksum-verified Miniforge
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/cadquery-baseline-miniforge"
          mkdir -p "$base"
          curl --fail --location --output "$base/Miniforge.sh" https://github.com/conda-forge/miniforge/releases/download/26.1.1-3/Miniforge3-26.1.1-3-Linux-x86_64.sh
          curl --fail --location --output "$base/Miniforge.sha256" https://github.com/conda-forge/miniforge/releases/download/26.1.1-3/Miniforge3-26.1.1-3-Linux-x86_64.sh.sha256
          expected="$(awk '{print $1}' "$base/Miniforge.sha256")"
          actual="$(sha256sum "$base/Miniforge.sh" | awk '{print $1}')"
          test "$actual" = "$expected"
          bash "$base/Miniforge.sh" -b -p "$RUNNER_TEMP/cadquery-baseline/miniforge"
      - name: Install declared dependencies and run complete baseline
        working-directory: source
        run: python ../validation/cadquery-validation-2104/baseline.py
      - name: Upload baseline environment and test artifacts
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cadquery-baseline-linux-2107
          path: ${{ runner.temp }}/cadquery-baseline/artifacts
          if-no-files-found: error
      - name: Record final source state
        if: ${{ !cancelled() }}
        working-directory: source
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git status --porcelain=v1 --untracked-files=all
          git diff --check
          df -h .
