name: Validate CadQuery iterable-edge tests

on:
  push:
    branches:
      - validate-cadquery-candidate-20261008

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMBA_NUM_THREADS: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: validation
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: CadQuery/cadquery
          ref: 5f5bc62b255f62e3512105740025361b6c31eddd
          path: source
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: CadQuery/cadquery
          ref: 5dfbf5c89932d9c438ba449e29732a6a56680aae
          path: candidate-source
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - name: Install checksum-verified Miniforge
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/cadquery-candidate/miniforge-installer"
          mkdir -p "$base"
          curl --fail --location --output "$base/Miniforge.sh" https://github.com/conda-forge/miniforge/releases/download/26.1.1-3/Miniforge3-26.1.1-3-Linux-x86_64.sh
          curl --fail --location --output "$base/Miniforge.sha256" https://github.com/conda-forge/miniforge/releases/download/26.1.1-3/Miniforge3-26.1.1-3-Linux-x86_64.sh.sha256
          test "$(sha256sum "$base/Miniforge.sh" | awk '{print $1}')" = "$(awk '{print $1}' "$base/Miniforge.sha256")"
          bash "$base/Miniforge.sh" -b -p "$RUNNER_TEMP/cadquery-candidate/miniforge"
      - name: Install native runtime libraries
        run: |
          set -euo pipefail
          test "$(git -C validation rev-parse HEAD)" = "$GITHUB_SHA"
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libgl1 libegl1 libxrender1 libxext6
          python --version
          uname -a
          df -h .
      - name: Run complete sequential baseline and candidate validation
        working-directory: validation
        env:
          CANDIDATE_TASK_DIR: ${{ runner.temp }}/cadquery-candidate
          CANDIDATE_BASELINE_SOURCE: ${{ github.workspace }}/source
          CANDIDATE_SOURCE: ${{ github.workspace }}/candidate-source
          CANDIDATE_ENV: ${{ runner.temp }}/cadquery-candidate/env
          CANDIDATE_CONDA: ${{ runner.temp }}/cadquery-candidate/miniforge/bin/conda
          CANDIDATE_MAMBA: ${{ runner.temp }}/cadquery-candidate/miniforge/bin/mamba
          MAMBA_ROOT_PREFIX: ${{ runner.temp }}/cadquery-candidate/miniforge
          CONDA_PKGS_DIRS: ${{ runner.temp }}/cadquery-candidate/conda-pkgs
          PIP_CACHE_DIR: ${{ runner.temp }}/cadquery-candidate/pip-cache
          CANDIDATE_MINIFORGE_DIR: ${{ runner.temp }}/cadquery-candidate/miniforge-installer
        run: python cadquery-validation-2104/candidate.py
      - name: Upload candidate artifacts
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cadquery-candidate-linux-2107
          path: ${{ runner.temp }}/cadquery-candidate/evidence
          if-no-files-found: error
